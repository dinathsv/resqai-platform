services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: resqai_db
    environment:
      POSTGRES_DB: resqai
      POSTGRES_USER: resqai_user
      POSTGRES_PASSWORD: resqai_pass
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resqai_user -d resqai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: resqai_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  python-api:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: resqai_python_api
    ports:
      - "8000:8000"
    volumes:
      - ./app:/workspace/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://resqai_user:resqai_pass@postgres:5432/resqai
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in your environment/.env}
      - AI_API_KEY=${AI_API_KEY:-dummy_key}
      - AI_MODEL=${AI_MODEL:-gemini-3.5-flash-lite}
      - SMSLENZ_USER_ID=${SMSLENZ_USER_ID:-2462}
      - SMSLENZ_API_KEY=${SMSLENZ_API_KEY:-3ef7d7d9-1ae3-4615-b43c-b795f67375e7}
      - SMSLENZ_SENDER_ID=${SMSLENZ_SENDER_ID:-SMSlenzDEMO}
      - SMSLENZ_BASE_URL=${SMSLENZ_BASE_URL:-https://smslenz.lk/api}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ml-models:
    build:
      context: ./ml-models
      dockerfile: Dockerfile
    container_name: resqai_ml_models
    ports:
      - "5005:5005"
    volumes:
      - ./ml-models:/app

  node-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resqai_node_backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - DATABASE_URL=postgres://resqai_user:resqai_pass@postgres:5432/resqai
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in your environment/.env}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in your environment/.env}
      - REDIS_URL=redis://redis:6379
      - SMSLENZ_USER_ID=${SMSLENZ_USER_ID:-2462}
      - SMSLENZ_API_KEY=${SMSLENZ_API_KEY:-3ef7d7d9-1ae3-4615-b43c-b795f67375e7}
      - SMSLENZ_SENDER_ID=${SMSLENZ_SENDER_ID:-SMSlenzDEMO}
      - SMSLENZ_BASE_URL=${SMSLENZ_BASE_URL:-https://smslenz.lk/api}
    depends_on:
      postgres:
        condition: service_healthy

  admin-dashboard:
    build:
      context: ./resqai-admin
      dockerfile: Dockerfile
    container_name: resqai_admin
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    depends_on:
      - node-backend

  mobile-app-web:
    build:
      context: ./mobile
      dockerfile: Dockerfile
    container_name: resqai_mobile
    ports:
      - "8081:8081"
    volumes:
      - ./mobile:/app
      - /app/node_modules
    environment:
      - EXPO_WEB_PORT=8081
      - HOST=0.0.0.0
      - WEB_HOST=0.0.0.0
    depends_on:
      - python-api
      - ml-models

volumes:
  pgdata:
