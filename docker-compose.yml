services:
  # ============================================
  # PostgreSQL + PostGIS
  # ============================================
  postgres:
    image: postgis/postgis:15-3.3
    container_name: resqai_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: resqai
      POSTGRES_USER: resqai_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resqai_user -d resqai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: resqai_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Explicit schema upgrades; run `docker compose run --rm migrate` before
  # starting upgraded APIs. Normal application startup remains read-only.
  migrate:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: app/Dockerfile
    environment:
      DATABASE_URL: ${PYTHON_DATABASE_URL:?Set PYTHON_DATABASE_URL in .env}
    volumes:
      - ./database:/workspace/database:ro
      - ./backend/migrations:/workspace/backend/migrations:ro
    command: ["python", "-m", "database.run_migrations"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  python-api:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: resqai_python_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./app:/workspace/app
    environment:
      DATABASE_URL: ${PYTHON_DATABASE_URL:?Set PYTHON_DATABASE_URL in .env}
      REDIS_URL: redis://redis:6379
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env}
      AI_API_KEY: ${AI_API_KEY:?Set AI_API_KEY in .env}
      AI_MODEL: ${AI_MODEL:-gemini-3.5-flash-lite}
      SMSLENZ_USER_ID: ${SMSLENZ_USER_ID:-}
      SMSLENZ_API_KEY: ${SMSLENZ_API_KEY:-}
      SMSLENZ_SENDER_ID: ${SMSLENZ_SENDER_ID:-}
      SMSLENZ_BASE_URL: ${SMSLENZ_BASE_URL:-https://smslenz.lk/api}
      NODE_BACKEND_URL: http://node-backend:5000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ml-models:
    build:
      context: ./ml-models
      dockerfile: Dockerfile
    container_name: resqai_ml_models
    restart: unless-stopped
    ports:
      - "5005:5005"
    volumes:
      - ./ml-models:/app
    environment:
      PORT: "5005"

  node-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resqai_node_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      DATABASE_URL: ${NODE_DATABASE_URL:?Set NODE_DATABASE_URL in .env}
      PORT: "5000"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      FASTAPI_URL: http://python-api:8000
      REDIS_URL: redis://redis:6379
      SMSLENZ_USER_ID: ${SMSLENZ_USER_ID:-}
      SMSLENZ_API_KEY: ${SMSLENZ_API_KEY:-}
      SMSLENZ_SENDER_ID: ${SMSLENZ_SENDER_ID:-}
      SMSLENZ_BASE_URL: ${SMSLENZ_BASE_URL:-https://smslenz.lk/api}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin-dashboard:
    build:
      context: ./resqai-admin
      dockerfile: Dockerfile
    container_name: resqai_admin
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./resqai-admin:/app
      - /app/node_modules
      - /app/.next
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000
      NEXT_PUBLIC_AUTH_API_URL: http://localhost:5000
      NEXT_PUBLIC_PASSWORD_API_URL: http://localhost:8000
    depends_on:
      - node-backend

  mobile-app-web:
    build:
      context: ./mobile
      dockerfile: Dockerfile
    container_name: resqai_mobile
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - ./mobile:/app
      - /app/node_modules
    environment:
      EXPO_WEB_PORT: "8081"
      HOST: 0.0.0.0
      WEB_HOST: 0.0.0.0
      EXPO_PUBLIC_API_URL: http://localhost:8000
      EXPO_PUBLIC_SOCKET_URL: http://localhost:5000
      EXPO_PUBLIC_NODE_API_URL: http://localhost:5000
      EXPO_PUBLIC_AI_URL: http://localhost:8000
      EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${EXPO_PUBLIC_GOOGLE_MAPS_API_KEY:-}
    depends_on:
      - python-api
      - ml-models

volumes:
  pgdata:
